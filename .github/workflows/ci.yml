name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test-server:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cinemaseat
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: cinemaseat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: cinemaseat/server

    env:
      DATABASE_URL: postgresql://cinemaseat:testpass@localhost:5432/cinemaseat_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test_secret
      GATEWAY_URL: http://localhost:9000
      CALLBACK_BASE_URL: http://localhost:3000
      HOLD_TTL_SECONDS: 30
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cinemaseat/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  lint-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cinemaseat/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cinemaseat/client/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:3000/api
          VITE_WS_URL: ws://localhost:3000

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-server, lint-client]
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t cinemaseat-server ./cinemaseat/server
      - name: Build client image
        run: docker build -t cinemaseat-client ./cinemaseat/client --build-arg VITE_API_URL=http://localhost:3000/api --build-arg VITE_WS_URL=ws://localhost:3000
