version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cinemaseat
      POSTGRES_PASSWORD: cinemaseat_pass
      POSTGRES_DB: cinemaseat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinemaseat"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    image: asifmahmoud414/mock-gateway:latest
    ports:
      - "9000:9000"

  server:
    build: ./server
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://cinemaseat:cinemaseat_pass@postgres:5432/cinemaseat
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret
      GATEWAY_URL: http://gateway:9000
      CALLBACK_BASE_URL: http://server:3000
      GATEWAY_SECRET: z2p-2026-secret
      HOLD_TTL_SECONDS: 15
      SWEEP_INTERVAL_MS: 2000
      CLIENT_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build: ./client
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  pgdata:
  redisdata:
